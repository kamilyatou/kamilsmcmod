plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.kamilyatou.kamilsmcmod'

base {
    archivesName = 'kamilsmcmod'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    mappings files("mappings.jar")
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.166.2+26.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}